<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daithon - Chess Arena Labs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Chess Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-magenta: #ff00ff;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .neon-text-blue { text-shadow: 0 0 10px var(--neon-blue); color: var(--neon-blue); }
        .neon-text-magenta { text-shadow: 0 0 10px var(--neon-magenta); color: var(--neon-magenta); }
        
        .chess-container {
            width: 500px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        /* Customize Board Colors */
        .white-1e1d7 { background-color: #cbd5e1 !important; color: #1e293b !important; }
        .black-3c85d { background-color: #475569 !important; color: #f8fafc !important; }

        .log-container {
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.85rem;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 2px solid var(--neon-blue);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Animated Grid Background */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [gameState, setGameState] = useState({ fen: 'start', turn: 'White' });
            const [logs, setLogs] = useState([{ type: 'sys', msg: 'AGI System Ready. Manual required for initialization.' }]);
            const [learningStatus, setLearningStatus] = useState('idle'); // idle, learning, learned
            const [causalVars, setCausalVars] = useState({});
            const [isAuto, setIsAuto] = useState(false);
            const boardRef = useRef(null);

            useEffect(() => {
                // Initialize Board
                boardRef.current = Chessboard('board', {
                    position: 'start',
                    draggable: false, 
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });

                fetchStatus();
                // Polling Cognitive Log
                const interval = setInterval(() => {
                    fetchCognitiveLog();
                    if (isAuto) fetchStatus();
                }, 2000);

                return () => clearInterval(interval);
            }, [isAuto]);

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/training/chess/status');
                    const data = await res.json();
                    setGameState(data);
                    setCausalVars(data.causal_vars || {});
                    if (boardRef.current && data.fen !== boardRef.current.fen()) {
                        boardRef.current.position(data.fen);
                    }
                } catch (e) {
                    addLog('error', 'Communication bridge failure.');
                }
            };

            const fetchCognitiveLog = async () => {
                try {
                    const res = await fetch('/api/training/cognitive_log');
                    const data = await res.json();
                    if (data.entries && data.entries.length > 0) {
                        const newLogs = data.entries.map(e => ({
                            type: e.agent.toLowerCase(),
                            msg: `[${e.phase}] ${e.thought}`,
                            time: new Date(e.timestamp * 1000).toLocaleTimeString()
                        })).reverse();
                        setLogs(newLogs.slice(0, 50));
                    }
                } catch (e) {}
            };

            const learnChessManual = async () => {
                setLearningStatus('learning');
                addLog('sys', 'Reading rulebook...');
                try {
                    // Cargar el manual (simulado o via API)
                    const manualText = `Chess is a strategy game... [Full Rulebook]`;
                    const res = await fetch('/api/training/learn_domain', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ domain: 'Chess', manual_text: 'PIECES: Pawn, Rook, Knight, Bishop, Queen, King. OBJECTIVE: Checkmate. RULES: Players take turns, capture diagonally, castle allowed, promotion enabled.' })
                    });
                    const data = await res.json();
                    setLearningStatus('learned');
                    addLog('sys', `Domain 'Chess' integrated. ${data.entities_learned} entities, ${data.rules_learned} rules identified.`);
                } catch (e) {
                    setLearningStatus('idle');
                    addLog('error', 'Learning failed.');
                }
            };

            const runAgiPractice = async () => {
                addLog('sys', 'Starting AGI Practice Session (Autonomous play)...');
                await fetch('/api/training/practice_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: 'Chess', iterations: 5 })
                });
            };

            const makeDaithonMove = async () => {
                addLog('sys', 'Daithon analyzing board via Semantic Graph...');
                try {
                    const res = await fetch('/api/training/chess/move', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ use_daithon: true })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        fetchStatus();
                    }
                } catch (e) {
                    addLog('error', 'Move execution error.');
                }
            };

            const resetGame = async () => {
                await fetch('/api/training/chess/reset', { method: 'POST' });
                addLog('sys', 'Arena reset.');
                fetchStatus();
            };

            const addLog = (type, msg) => {
                setLogs(prev => [{ type, msg, time: new Date().toLocaleTimeString() }, ...prev].slice(0, 50));
            };

            return (
                <div className="min-h-screen p-8 flex flex-col items-center">
                    {/* Header */}
                    <header className="mb-8 text-center">
                        <h1 className="orbitron text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-[#00f2ff] to-[#ff00ff]">
                            DAITHON COGNITIVE ARENA
                        </h1>
                        <div className="flex justify-center gap-4 mt-2">
                            <span className="text-slate-400 font-light tracking-widest text-xs uppercase">
                                Domain: {learningStatus === 'learned' ? <span className="text-cyan-400">CHESS (SYNCHRONIZED)</span> : 'UNINITIALIZED'}
                            </span>
                        </div>
                    </header>

                    <div className="flex flex-col lg:flex-row gap-8 w-full max-w-7xl">
                        {/* Left Panel: AGI Toolbox */}
                        <div className="w-full lg:w-1/4 space-y-6">
                            <div className="glass p-6 rounded-xl relative overflow-hidden border-[#00f2ff]/30">
                                <h2 className="orbitron text-sm mb-4 text-[#00f2ff] tracking-widest uppercase">Learning Protocol</h2>
                                <button 
                                    onClick={learnChessManual}
                                    disabled={learningStatus !== 'idle'}
                                    className={`w-full py-3 rounded font-bold text-xs orbitron transition-all border ${
                                        learningStatus === 'learned' ? 'bg-cyan-900/40 border-cyan-400 text-cyan-400' : 
                                        learningStatus === 'learning' ? 'bg-slate-800 border-yellow-500 animate-pulse' : 
                                        'bg-slate-900 border-cyan-500 hover:bg-cyan-500/10'
                                    }`}
                                >
                                    {learningStatus === 'learned' ? 'DOMAIN SYNCED' : 'IMPORT RULEBOOK'}
                                </button>
                                {learningStatus === 'learned' && (
                                    <button 
                                        onClick={runAgiPractice}
                                        className="w-full mt-3 py-3 rounded font-bold text-xs orbitron bg-magenta-600/20 border border-magenta-500 text-magenta-500 hover:bg-magenta-500/20 transition-all"
                                    >
                                        RUN AGI PRACTICE
                                    </button>
                                )}
                            </div>

                            <div className="glass p-6 rounded-xl border-slate-700">
                                <h3 className="orbitron text-xs text-slate-500 mb-4 uppercase">Causal Anchors</h3>
                                <div className="space-y-4">
                                    <StatBar label="Material" value={causalVars.material_balance} min={-10} max={10} color="#00f2ff" />
                                    <StatBar label="Control" value={causalVars.center_control} min={-4} max={4} color="#0ea5e9" />
                                    <StatBar label="Mobility" value={causalVars.mobility} min={0} max={50} color="#38bdf8" />
                                </div>
                            </div>
                        </div>

                        {/* Center: The Board */}
                        <div className="flex-1 flex flex-col items-center">
                            <div className="chess-container mb-6 p-2 bg-slate-900/50">
                                <div id="board" style={{ width: '500px' }}></div>
                            </div>
                            <div className="flex gap-4">
                                <button 
                                    onClick={makeDaithonMove}
                                    className="px-8 py-3 bg-gradient-to-b from-sky-500 to-sky-700 hover:from-sky-400 hover:to-sky-600 rounded-lg font-bold transition-all shadow-xl shadow-sky-900/40"
                                >
                                    EXECUTE AGENT
                                </button>
                                <button 
                                    onClick={resetGame}
                                    className="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-lg font-bold border border-slate-600"
                                >
                                    RESET
                                </button>
                            </div>
                        </div>

                        {/* Right Panel: Cognitive Stream */}
                        <div className="w-full lg:w-1/3 flex flex-col glass p-6 rounded-xl border-white/5">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="orbitron text-sm text-slate-400 uppercase tracking-widest">Cognitive Log</h2>
                                {isAuto && <span className="flex h-2 w-2 rounded-full bg-magenta-500 animate-ping"></span>}
                            </div>
                            <div className="log-container flex-1 scroll-smooth">
                                {logs.map((log, i) => (
                                    <div key={i} className="log-entry border-l-[#00f2ff]">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className={`text-[9px] font-black uppercase ${
                                                log.type === 'senku' ? 'text-blue-400' : 
                                                log.type === 'xeno' ? 'text-magenta-400' : 
                                                log.type === 'contextus' ? 'text-cyan-300' : 'text-slate-500'
                                            }`}>
                                                {log.type}
                                            </span>
                                            <span className="text-[8px] text-slate-700 font-mono">{log.time}</span>
                                        </div>
                                        <p className="text-[11px] leading-relaxed text-slate-300 font-medium">{log.msg}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <footer className="mt-12 opacity-30 text-[9px] uppercase tracking-[0.3em] font-black">
                        Daithon Cognitive Arena // Integrated AGI System
                    </footer>
                </div>
            );
        };

        const StatBar = ({ label, value = 0, min, max, color }) => {
            const percentage = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
            return (
                <div className="space-y-1">
                    <div className="flex justify-between text-[10px] uppercase font-bold tracking-wider text-slate-400">
                        <span>{label}</span>
                        <span>{value.toFixed(2)}</span>
                    </div>
                    <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                        <div 
                            className="h-full rounded-full transition-all duration-500 ease-out"
                            style={{ width: `${percentage}%`, backgroundColor: color, boxShadow: `0 0 10px ${color}` }}
                        ></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
